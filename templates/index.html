<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <meta charset="UTF-8">
    <title>Grafo Wikipedia</title>
    <style>

  /* se a lib usar um container com id diferente, inclua ele aqui */
</style>

</head>
<body>
    <!-- <h2 class="titulo-grafo">Gerar Grafo Wikipedia</h2> -->
    <div class="container">
        <h2>Gerar Grafo Wikipedia</h2>

        <form id="formulario" action="/grafo" method="post" aria-label="Formulário gerar grafo">

            <div class="form-row">
                <div class="campo">
                    <input type="text" name="start" required placeholder="Página inicial">
                </div>

                <div class="arrow-stack">
                    <span class="material-symbols-outlined seta" aria-hidden="true">arrow_right_alt</span>
                    <span class="material-symbols-outlined seta" aria-hidden="true">arrow_left_alt</span>
                </div>

                <div class="campo">
                    <input type="text" name="end" required placeholder="Página final">
                </div>
            </div>

            <div class="controls-bottom">
                <div class="campo">
                    <label for="depth">Profundidade:</label>
                    <input class="small-input" id="depth" type="number" name="depth" value="3" required>
                </div>

                <div class="campo">
                    <label for="paths">Nº máx. caminhos:</label>
                    <input class="small-input" id="paths" type="number" name="paths" value="5" required>
                </div>

                <div class="botao-centro">
                    <button type="submit" id="submitBtn" aria-live="polite">
                        <span class="btn-spinner" aria-hidden="true"></span>
                        <span class="btn-text">Gerar Grafo</span>
                    </button>
                </div>
            </div>

        </form>

        <div id="resultado">
            <iframe id="grafoFrame" title="Grafo gerado" style="display:none"></iframe>
        </div>
    </div>

<script>
const form = document.getElementById('formulario');
const submitBtn = document.getElementById('submitBtn');
const btnSpinner = submitBtn.querySelector('.btn-spinner');
const btnText = submitBtn.querySelector('.btn-text');
const iframe = document.getElementById('grafoFrame');

function setLoading(on){
    if(on){
        submitBtn.disabled = true;
        btnSpinner.style.display = 'inline-block';
        btnText.textContent = 'Gerando...';
    } else {
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Gerar Grafo';
    }
}

form.addEventListener('submit', async function(e){
    e.preventDefault();
    setLoading(true);
    const formData = new FormData(this);
    try{
        const res = await fetch('/grafo', {method:'POST', body: formData});
        const data = await res.json();
        if(data && data.html_file){
            iframe.style.display = 'block';
            // set src after making visible
            iframe.src = data.html_file;
            // restore loading once iframe reports loaded (if it loads an external page)
            iframe.onload = function(){ setLoading(false); };
            // as a fallback, stop loading after 6s
            setTimeout(()=>{ setLoading(false); }, 6000);
        } else {
            alert('Erro: ' + (data && data.error ? data.error : 'Resposta inválida'));
            setLoading(false);
        }
    }catch(err){
        alert('Erro: ' + err);
        setLoading(false);
    }
});

// quando o iframe terminar de carregar, injeta CSS (funciona só se for mesma origem)
iframe.addEventListener("load", () => {
  try {
    const doc = iframe.contentDocument || iframe.contentWindow.document;
    if (!doc) return;

    // Cria e injeta um bloco de estilo que zera margens/paddings
    const style = doc.createElement('style');
    style.innerHTML = `
      html, body { margin: 0 !important; padding: 0 !important; overflow: hidden; height: 100%; box-sizing: border-box; background: transparent; }
      svg, canvas, div { margin: 0 !important; padding: 0 !important; display: block; box-sizing: border-box; }
      #mynetwork, #network, .vis-network { width: 100% !important; height: 100% !important; margin: 0 !important; padding: 0 !important; }
    `;
    (doc.head || doc.documentElement).appendChild(style);

    // opcional: forçar o container principal a ocupar tudo
    const main = doc.getElementById('mynetwork') || doc.getElementById('network');
    if (main) {
      main.style.width = '100%';
      main.style.height = '100%';
      main.style.margin = '0';
      main.style.padding = '0';
    }
  } catch (err) {
    console.warn('Não foi possível injetar CSS no iframe (provável cross-origin):', err);
  }
});
</script>


</body>
</html>
