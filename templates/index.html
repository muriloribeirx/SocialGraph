<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Grafo Wikipedia</title>
</head>
<body>
    <h2>Gerar Grafo Wikipedia</h2>

    <form action="/grafo" method="post">

        <label for="start">Start:</label><br>
        <input type="text" name="start" required><br><br>

        <label for="end">End:</label><br>
        <input type="text" name="end" required><br><br>

        <label for="depth">Profundidade:</label><br>
        <input type="number" name="depth" value="3" required><br><br>

        <label for="paths">Número máx. de caminhos:</label><br>
        <input type="number" name="paths" value="5" required><br><br>

        <button type="submit">Gerar Grafo</button>
    </form>
</body>
</html>
